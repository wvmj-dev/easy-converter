[package]
name = "easy-converter"
version = "0.0.0"
description = "Convert and edit files locally, without uploading anything"
authors = ["Wender"]
license = "GPL-3.0-only"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
name = "easy_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "macros", "rt"] }
ts-rs = "12"
# Only the formats the app reads and writes; the default set pulls AVIF/EXR encoders
# (and their large dependency trees) that are out of scope for now.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "ico"] }

[dev-dependencies]
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "macros", "rt", "rt-multi-thread", "test-util"] }

