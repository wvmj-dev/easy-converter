[package]
name = "easy-converter"
version = "0.0.0"
description = "Convert and edit files locally, without uploading anything"
authors = ["Wender"]
license = "GPL-3.0-only"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
name = "easy_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
