[package]
name = "easy-converter"
version = "0.1.0"
description = "Convert and edit files locally, without uploading anything"
authors = ["Wender"]
license = "GPL-3.0-only"
repository = "https://github.com/wvmj-dev/easy-converter"
edition = "2021"
publish = false

[lib]
# The `_lib` suffix avoids a name clash between the lib and bin targets on Windows.
name = "easy_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "macros", "rt"] }
ts-rs = "12"
# Only the formats the app reads and writes; the default set pulls AVIF/EXR encoders
# (and their large dependency trees) that are out of scope for now.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff", "ico"] }
# PDF: lopdf builds PDFs from images; pdfium-render drives the bundled PDFium library,
# always inside an isolated worker process (see `pdf_worker`).
lopdf = { version = "0.47.0", default-features = false }
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest", "image_latest"] }

[dev-dependencies]
tokio = { version = "1", features = ["process", "time", "sync", "io-util", "macros", "rt", "rt-multi-thread", "test-util"] }

# Image codecs are very slow without optimizations; this keeps `cargo test` and
# `tauri dev` usable while the app's own code stays quick to compile.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
# Keep `panic = "unwind"` (the default): a panic inside a job is caught by the queue and
# reported as a failed job instead of closing the app.
