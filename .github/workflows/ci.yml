name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install app tools
        run: |
          sudo apt-get install -y \
            ffmpeg qpdf tesseract-ocr tesseract-ocr-por tesseract-ocr-eng \
            libimage-exiftool-perl ghostscript
          # Optional tools of the office phase; the -nogui builds are enough headless.
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui \
            pandoc
          # Optional tools of the last phase: ebooks and archives the Rust readers do not open.
          sudo apt-get install -y --no-install-recommends calibre p7zip-full

      # Bundled with the app as a resource; the Rust build fails without it.
      - name: Fetch PDFium
        run: ./scripts/fetch-pdfium.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test

      # The Rust build embeds the frontend, so dist/ must exist first.
      - name: Build frontend
        run: npm run build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # cargo test regenerates src/types; fail if the committed bindings are outdated.
      - name: Check generated TypeScript types
        run: |
          if [ -n "$(git status --porcelain -- src/types)" ]; then
            git status --porcelain -- src/types
            echo "src/types is outdated: run 'cargo test' in src-tauri and commit the result."
            exit 1
          fi
